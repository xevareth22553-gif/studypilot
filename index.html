<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>StudyPilot — Your Study System</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 50% -10%, #18295c 0%, transparent 35%),
        radial-gradient(circle at 90% 30%, #102a42 0%, transparent 25%),
        #050811;
      color: #fff;
      line-height: 1.6;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.18;
      background-image:
        linear-gradient(rgba(80,130,255,.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(80,130,255,.08) 1px, transparent 1px);
      background-size: 45px 45px;
      mask-image: linear-gradient(to bottom, black, transparent 80%);
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .container {
      width: 92%;
      max-width: 1150px;
      margin: auto;
    }

    /* NAVBAR */

    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 17px 0;
      border-bottom: 1px solid rgba(120,150,220,.15);
      background: rgba(5,8,17,.78);
      backdrop-filter: blur(16px);
    }

    .nav-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.7px;
    }

    .logo span {
      color: #66aaff;
    }

    .nav-links {
      display: flex;
      gap: 25px;
      align-items: center;
      color: #9faac2;
      font-size: 14px;
    }

    .nav-links a:hover {
      color: #fff;
    }

    .nav-button {
      background: linear-gradient(135deg, #fff, #cddcff);
      color: #050811;
      padding: 9px 16px;
      border-radius: 9px;
      font-weight: 800;
      font-size: 14px;
    }

    /* HERO */

    .hero {
      position: relative;
      text-align: center;
      padding: 105px 0 85px;
    }

    .hero-glow {
      position: absolute;
      width: 500px;
      height: 300px;
      left: 50%;
      top: 30px;
      transform: translateX(-50%);
      background: #286cff;
      filter: blur(150px);
      opacity: .12;
      pointer-events: none;
    }

    .badge {
      display: inline-block;
      padding: 7px 14px;
      border: 1px solid rgba(100,160,255,.35);
      border-radius: 50px;
      color: #9fc1ff;
      font-size: 12px;
      letter-spacing: .5px;
      background: rgba(35,65,130,.18);
      box-shadow: 0 0 25px rgba(50,120,255,.08);
      margin-bottom: 25px;
    }

    h1 {
      position: relative;
      font-size: clamp(48px, 9vw, 86px);
      line-height: .98;
      letter-spacing: -4px;
      margin-bottom: 27px;
      font-weight: 900;
    }

    .gradient {
      background: linear-gradient(90deg, #ffffff, #76aaff, #9c8cff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
